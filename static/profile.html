<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container" id="profileContainer" style="display: none;">
        <div class="card profile-card">
            <div class="header" style="margin-bottom: 1.5rem;">
                <h1 style="font-size: 1.25rem;">Profile Details</h1>
            </div>
            <div class="avatar" id="avatarInitial">U</div>
            <div class="profile-info">
                <div class="info-row">
                    <span class="info-label">Username</span>
                    <span class="info-value" id="profileUsername">...</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email</span>
                    <span class="info-value" id="profileEmail">...</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Role</span>
                    <span class="info-value" id="profileRole">...</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Member Since</span>
                    <span class="info-value" id="profileJoined">...</span>
                </div>
            </div>
            <button class="btn btn-logout" id="logoutBtn">Log out</button>
        </div>
    </div>
    
    <div class="container" id="loadingContainer">
        <div class="card" style="text-align: center; padding: 3rem 2rem;">
            <p style="color: #6b7280; font-size: 0.95rem;">Loading your profile...</p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // Check authentication immediately
        const authToken = localStorage.getItem('token');
        if (!authToken) {
            window.location.href = '/';
        } else {
            // Load profile data
            fetchProfile();
        }
    </script>
</body>
</html>
